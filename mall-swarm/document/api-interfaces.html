<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mall-swarm 后端接口文档</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --c-bg: #f5f7fa;
    --c-card: #ffffff;
    --c-text: #1f2937;
    --c-text-soft: #6b7280;
    --c-border: #e5e7eb;
    --c-primary: #2563eb;
    --c-primary-dark: #1d4ed8;
    --c-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --c-shadow-lg: 0 10px 25px rgba(0,0,0,.08);
    --get: #16a34a;
    --get-bg: #dcfce7;
    --post: #2563eb;
    --post-bg: #dbeafe;
    --put: #ea580c;
    --put-bg: #ffedd5;
    --delete: #dc2626;
    --delete-bg: #fee2e2;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    background: var(--c-bg);
    color: var(--c-text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    color: #fff;
    padding: 18px 32px;
    box-shadow: 0 2px 12px rgba(37,99,235,.25);
  }
  .header-inner {
    max-width: 1500px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
  .header h1 .logo { font-size: 26px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat-pill {
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.25);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 500;
    backdrop-filter: blur(4px);
  }
  .stat-pill b { font-size: 15px; margin-right: 4px; }

  /* Layout */
  .layout { display: flex; max-width: 1500px; margin: 0 auto; gap: 24px; padding: 24px 24px 60px; }

  /* Sidebar */
  .sidebar {
    position: sticky; top: 96px;
    flex: 0 0 240px;
    align-self: flex-start;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    background: var(--c-card);
    border: 1px solid var(--c-border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: var(--c-shadow);
  }
  .sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--c-text-soft); padding: 6px 10px 10px; border-bottom: 1px solid var(--c-border); margin-bottom: 8px; }
  .nav-link {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    color: var(--c-text); text-decoration: none; font-size: 14px; font-weight: 500;
    transition: all .15s ease; margin-bottom: 2px;
  }
  .nav-link:hover { background: #eff6ff; color: var(--c-primary); }
  .nav-link.active { background: var(--c-primary); color: #fff; }
  .nav-link .count { font-size: 12px; opacity: .75; background: rgba(0,0,0,.06); padding: 1px 8px; border-radius: 999px; }
  .nav-link.active .count { background: rgba(255,255,255,.25); }

  /* Content */
  .content { flex: 1; min-width: 0; }
  .module-card {
    background: var(--c-card);
    border: 1px solid var(--c-border);
    border-radius: 14px;
    box-shadow: var(--c-shadow);
    margin-bottom: 24px;
    overflow: hidden;
    scroll-margin-top: 96px;
  }
  .module-head {
    padding: 18px 24px;
    background: linear-gradient(90deg, #f8fafc, #ffffff);
    border-bottom: 1px solid var(--c-border);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .module-head .title { display: flex; align-items: center; gap: 12px; }
  .module-head .tag {
    background: var(--c-primary); color: #fff; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 6px;
  }
  .module-head h2 { font-size: 19px; font-weight: 700; }
  .module-head .meta { font-size: 13px; color: var(--c-text-soft); }
  .module-head .meta b { color: var(--c-primary); }

  .controller-block { padding: 0 24px; border-bottom: 1px solid var(--c-border); }
  .controller-block:last-child { border-bottom: none; }
  .controller-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 16px 0 8px;
  }
  .controller-head .cname { font-size: 15px; font-weight: 700; color: var(--c-text); }
  .controller-head .cdesc { font-size: 13px; color: var(--c-text-soft); }
  .controller-head .base {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 12px; background: #f1f5f9; color: #334155;
    padding: 2px 8px; border-radius: 5px;
  }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
    color: var(--c-text-soft); padding: 8px 10px; border-bottom: 1px solid var(--c-border);
  }
  tbody td { padding: 11px 10px; border-bottom: 1px solid #f3f4f6; font-size: 13.5px; vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #f9fafb; }

  .method {
    display: inline-block; min-width: 56px; text-align: center;
    font-size: 11px; font-weight: 700; padding: 3px 0; border-radius: 5px; letter-spacing: .3px;
  }
  .method.GET { color: var(--get); background: var(--get-bg); }
  .method.POST { color: var(--post); background: var(--post-bg); }
  .method.PUT { color: var(--put); background: var(--put-bg); }
  .method.DELETE { color: var(--delete); background: var(--delete-bg); }

  .path {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 12.5px; word-break: break-all; color: #0f172a;
  }
  .desc { color: var(--c-text); }
  .params {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 12px; color: var(--c-text-soft); word-break: break-word;
  }
  .params .none { color: #cbd5e1; font-style: italic; }
  .col-method { width: 80px; }
  .col-path { width: 30%; }
  .col-params { width: 26%; }

  .menu-toggle { display: none; }

  /* Responsive */
  @media (max-width: 900px) {
    .layout { flex-direction: column; padding: 16px; }
    .sidebar {
      position: static; flex: none; width: 100%; max-height: none;
      order: 2;
    }
    .sidebar.collapsed { display: none; }
    .content { order: 1; }
    .menu-toggle {
      display: inline-block; margin-bottom: 12px;
      background: var(--c-primary); color: #fff; border: none; cursor: pointer;
      padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    }
    .header { padding: 14px 16px; }
    .header h1 { font-size: 18px; }
    .module-head, .controller-block { padding-left: 16px; padding-right: 16px; }
  }
  @media (max-width: 600px) {
    .col-params { width: auto; }
    .path { font-size: 11.5px; }
  }

  /* Scrollbar */
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <h1><span class="logo">🛒</span> mall-swarm 后端接口文档</h1>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="layout">
  <button class="menu-toggle" onclick="toggleSidebar()">☰ 模块导航</button>

    <h3>模块导航</h3>
    <nav id="nav"></nav>
  </aside>

  <main class="content" id="content"></main>
</div>

// 统计
let totalApis = 0;
const moduleCounts = DATA.map(m => {
  let c = 0;
  m.controllers.forEach(ctrl => c += ctrl.apis.length);
  totalApis += c;
  return { module: m.module, desc: m.desc, count: c, controllers: m.controllers.length };
});

// 顶部统计
const statsEl = document.getElementById('stats');
statsEl.innerHTML =
  '<span class="stat-pill"><b>' + totalApis + '</b>个接口</span>' +
  '<span class="stat-pill"><b>' + DATA.reduce((s,m)=>s+m.controllers.length,0) + '</b>个控制器</span>' +
  '<span class="stat-pill"><b>' + DATA.length + '</b>个模块</span>';

// 左侧导航
const navEl = document.getElementById('nav');
navEl.innerHTML = moduleCounts.map((m, i) =>
  '<a class="nav-link" data-idx="' + i + '" href="#mod-' + i + '">' +
    '<span>' + m.module + '</span>' +
    '<span class="count">' + m.count + '</span>' +
  '</a>'
).join('');

// 右侧内容
const contentEl = document.getElementById('content');
let html = '';
DATA.forEach((m, mi) => {
  const mc = moduleCounts[mi];
  html += '<section class="module-card" id="mod-' + mi + '">';
  html += '<div class="module-head">';
  html += '<div class="title"><span class="tag">模块</span><h2>' + m.module + '</h2></div>';
  html += '<div class="meta">' + m.desc + ' · <b>' + mc.controllers + '</b> 个控制器 · <b>' + mc.count + '</b> 个接口</div>';
  html += '</div>';
  m.controllers.forEach(ctrl => {
    html += '<div class="controller-block">';
    html += '<div class="controller-head">';
    html += '<span class="cname">' + ctrl.name + '</span>';
    html += '<span class="cdesc">' + ctrl.desc + '</span>';
    html += '<span class="base">basePath: ' + ctrl.basePath + '</span>';
    html += '</div>';
    html += '<table><thead><tr>';
    html += '<th class="col-method">方法</th><th class="col-path">路径</th><th>说明</th><th class="col-params">参数</th>';
    html += '</tr></thead><tbody>';
    ctrl.apis.forEach(a => {
      const paramsHtml = (!a.params || a.params === '无')
        ? '<span class="none">无</span>'
        : a.params;
      html += '<tr>';
      html += '<td><span class="method ' + a.method + '">' + a.method + '</span></td>';
      html += '<td class="path">' + a.path + '</td>';
      html += '<td class="desc">' + a.desc + '</td>';
      html += '<td class="params">' + paramsHtml + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    html += '</div>';
  });
  html += '</section>';
});
contentEl.innerHTML = html;

// 导航点击 + 滚动高亮
const navLinks = navEl.querySelectorAll('.nav-link');
function setActive(idx) {
  navLinks.forEach(l => l.classList.remove('active'));
  if (navLinks[idx]) navLinks[idx].classList.add('active');
}
navLinks.forEach(link => {
  link.addEventListener('click', () => {
    setActive(parseInt(link.dataset.idx, 10));
    if (window.innerWidth <= 900) {
      document.getElementById('sidebar').classList.add('collapsed');
    }
  });
});

// 滚动监听高亮当前模块
const sections = contentEl.querySelectorAll('.module-card');
window.addEventListener('scroll', () => {
  const top = window.scrollY + 120;
  let current = 0;
  sections.forEach((sec, i) => {
    if (sec.offsetTop <= top) current = i;
  });
  setActive(current);
}, { passive: true });

// 移动端切换
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}
window.addEventListener('resize', () => {
  if (window.innerWidth > 900) {
    document.getElementById('sidebar').classList.remove('collapsed');
  }
});

setActive(0);
</script>

</body>
</html>
